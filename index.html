<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi Ticket — Mesa de Ayuda Lyncott</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ─── Reset & Tokens ─── */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#F7F7F8;
  --surface:#FFFFFF;
  --surface-hover:#F9F9FA;
  --border:#E5E5E7;
  --border-strong:#D1D1D6;
  --red:#CC0000;
  --red-hover:#AA0000;
  --red-subtle:#FFF1F1;
  --red-border:rgba(204,0,0,.18);
  --text:#09090B;
  --text-2:#52525B;
  --text-3:#A1A1AA;
  --green:#16A34A;
  --green-subtle:#F0FDF4;
  --green-border:#BBF7D0;
  --orange:#C2410C;
  --orange-subtle:#FFF7ED;
  --orange-border:#FED7AA;
  --blue:#1D4ED8;
  --blue-subtle:#EFF6FF;
  --blue-border:#BFDBFE;
  --shadow-sm:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.04);
  --shadow-lg:0 20px 60px rgba(0,0,0,.10),0 8px 24px rgba(0,0,0,.06);
  --radius-sm:8px;
  --radius-md:12px;
  --radius-lg:16px;
  --radius-xl:20px;
  --font:'Inter',system-ui,-apple-system,sans-serif;
}
html{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;min-height:100vh}

/* ─── Top accent bar ─── */
.accent-bar{height:3px;background:var(--red);position:fixed;top:0;left:0;right:0;z-index:100}
.accent-bar.green{background:linear-gradient(90deg,#16A34A,#22C55E)}

/* ─── Nav ─── */
.nav{position:fixed;top:3px;left:0;right:0;z-index:99;background:rgba(255,255,255,.88);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.nav-inner{max-width:720px;margin:0 auto;padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit}
.brand-logo{width:30px;height:30px;border-radius:8px;background:var(--red);display:flex;align-items:center;justify-content:center}
.brand-logo svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand-name{font-size:13px;font-weight:600;color:var(--text);letter-spacing:-.2px}
.brand-sub{font-size:11px;color:var(--text-3);margin-top:-1px}
.nav-status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-3)}
.live-dot{width:7px;height:7px;border-radius:50%;background:#16A34A;animation:blink 2s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* ─── Layout ─── */
.page{max-width:720px;margin:0 auto;padding:100px 24px 80px}

/* ─── Search screen ─── */
.search-hero{text-align:center;padding:48px 0 56px}
.search-hero-eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--red);background:var(--red-subtle);border:1px solid var(--red-border);padding:4px 12px;border-radius:100px;margin-bottom:24px}
.search-hero h1{font-size:clamp(32px,6vw,52px);font-weight:800;letter-spacing:-2px;line-height:1.05;margin-bottom:14px;color:var(--text)}
.search-hero h1 span{color:var(--red)}
.search-hero p{font-size:16px;color:var(--text-2);max-width:380px;margin:0 auto}
.search-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);overflow:hidden;max-width:520px;margin:0 auto}
.search-box-inner{padding:32px}
.field-label{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}
.input-row{display:flex;gap:10px}
.ticket-input{flex:1;padding:12px 16px;font-size:20px;font-weight:700;font-family:var(--font);border:2px solid var(--border);border-radius:var(--radius-md);outline:none;color:var(--text);background:var(--bg);transition:border-color .15s,box-shadow .15s;letter-spacing:-.5px}
.ticket-input::placeholder{color:var(--text-3);font-weight:400;font-size:16px}
.ticket-input:focus{border-color:var(--red);box-shadow:0 0 0 4px rgba(204,0,0,.08)}
.ticket-input.error{border-color:var(--orange);box-shadow:0 0 0 4px rgba(194,65,12,.08)}
.btn-primary{padding:12px 24px;background:var(--red);color:#fff;font-family:var(--font);font-size:14px;font-weight:700;border:none;border-radius:var(--radius-md);cursor:pointer;transition:background .15s,transform .1s,box-shadow .15s;white-space:nowrap;letter-spacing:-.2px}
.btn-primary:hover{background:var(--red-hover);box-shadow:0 4px 12px rgba(204,0,0,.3)}
.btn-primary:active{transform:scale(.97)}
.input-hint{font-size:12px;color:var(--text-3);margin-top:8px;min-height:16px;transition:color .15s}
.input-hint.err{color:var(--orange)}
.search-box-footer{padding:16px 32px;background:var(--bg);border-top:1px solid var(--border);display:flex;align-items:center;gap:8px}
.search-box-footer svg{flex-shrink:0;color:var(--text-3)}
.search-box-footer span{font-size:12px;color:var(--text-3);line-height:1.4}

/* ─── Ticket cards ─── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);margin-bottom:16px;overflow:hidden;animation:fadeUp .4s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card:nth-child(2){animation-delay:.06s}
.card:nth-child(3){animation-delay:.12s}
.card:nth-child(4){animation-delay:.18s}

/* ─── Ticket header ─── */
.ticket-header{padding:24px 28px;border-bottom:1px solid var(--border);display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ticket-num-block{}
.ticket-num-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:2px}
.ticket-num{font-size:44px;font-weight:800;letter-spacing:-2.5px;line-height:1;color:var(--red)}
.ticket-num.green{color:var(--green)}
.ticket-meta{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0}

/* ─── Status badge ─── */
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:600;border:1px solid}
.badge-open{background:var(--blue-subtle);color:var(--blue);border-color:var(--blue-border)}
.badge-inprogress{background:var(--orange-subtle);color:var(--orange);border-color:var(--orange-border)}
.badge-resolved{background:var(--green-subtle);color:var(--green);border-color:var(--green-border)}
.badge-dot{width:7px;height:7px;border-radius:50%}
.badge-open .badge-dot{background:var(--blue)}
.badge-inprogress .badge-dot{background:var(--orange);animation:pulse 1.4s ease infinite}
.badge-resolved .badge-dot{background:var(--green)}
@keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.6);opacity:.4}}
.ticket-date-label{font-size:12px;color:var(--text-3)}

/* ─── Progress stages ─── */
.stages-section{padding:24px 28px;border-bottom:1px solid var(--border)}
.stages-title{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:18px}
.stages{display:flex;align-items:flex-start;gap:0;position:relative}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;position:relative}
.stage:not(:last-child)::after{content:'';position:absolute;top:14px;left:50%;right:-50%;height:2px;background:var(--border);z-index:0}
.stage:not(:last-child).done::after{background:var(--green)}
.stage-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;z-index:1;flex-shrink:0;transition:all .3s}
.stage-circle.done{background:var(--green);border:2px solid var(--green)}
.stage-circle.active{background:var(--surface);border:2px solid var(--orange);box-shadow:0 0 0 4px rgba(194,65,12,.12)}
.stage-circle.pending{background:var(--bg);border:2px solid var(--border)}
.stage-circle.done svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none}
.stage-circle.active::before{content:'';position:absolute;width:10px;height:10px;border-radius:50%;background:var(--orange);animation:pulse 1.2s ease infinite}
.stage-circle.pending::before{content:'';position:absolute;width:8px;height:8px;border-radius:50%;background:var(--border)}
.stage-label{font-size:11px;font-weight:500;color:var(--text-3);margin-top:8px;text-align:center;line-height:1.3}
.stage-label.done{color:var(--green);font-weight:600}
.stage-label.active{color:var(--orange);font-weight:700}

/* ─── Queue section ─── */
.queue-section{padding:20px 28px;border-bottom:1px solid var(--border);background:var(--red-subtle)}
.queue-banner{display:flex;align-items:center;gap:12px}
.queue-icon{width:40px;height:40px;border-radius:var(--radius-md);background:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.queue-icon svg{width:18px;height:18px;stroke:#fff;stroke-width:2;fill:none}
.queue-text{}
.queue-main{font-size:14px;font-weight:600;color:var(--text)}
.queue-main strong{color:var(--red)}
.queue-sub{font-size:12px;color:var(--text-2);margin-top:2px}
.queue-number{margin-left:auto;text-align:center}
.queue-number-val{font-size:36px;font-weight:800;letter-spacing:-2px;line-height:1;color:var(--red)}
.queue-number-label{font-size:10px;font-weight:600;color:var(--text-3);letter-spacing:.05em;text-transform:uppercase}

/* ─── Detail grid ─── */
.details-section{padding:24px 28px}
.details-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
.detail-item{}
.detail-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.detail-val{font-size:14px;font-weight:500;color:var(--text)}
.detail-val.highlight{color:var(--red);font-weight:600}

/* ─── Technician card ─── */
.tec-card{display:flex;align-items:center;gap:14px;padding:16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);margin-bottom:20px}
.tec-avatar{width:44px;height:44px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:#fff;flex-shrink:0;letter-spacing:-.5px}
.tec-info{}
.tec-name{font-size:14px;font-weight:600;color:var(--text)}
.tec-role{font-size:12px;color:var(--text-3);margin-top:1px}
.tec-active{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:12px;color:var(--green);font-weight:500;flex-shrink:0}
.tec-active::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);display:block}

/* ─── Description box ─── */
.desc-box{padding:14px 16px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-md);font-size:14px;line-height:1.65;color:var(--text-2);border-left:3px solid var(--border-strong)}
.desc-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);margin-bottom:8px}

/* ─── Solution box ─── */
.solution-box{padding:14px 16px;background:var(--green-subtle);border:1px solid var(--green-border);border-radius:var(--radius-md);font-size:14px;line-height:1.65;color:var(--text);border-left:3px solid var(--green)}

/* ─── CSAT ─── */
.csat-section{padding:24px 28px}
.csat-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.csat-sub{font-size:13px;color:var(--text-3);margin-bottom:20px}
.csat-row{display:flex;gap:10px;justify-content:center;margin-bottom:16px}
.csat-btn{width:56px;height:56px;border:2px solid var(--border);border-radius:var(--radius-lg);background:var(--bg);cursor:pointer;font-size:24px;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.csat-btn:hover{border-color:var(--border-strong);transform:scale(1.08);background:var(--surface)}
.csat-btn.selected{border-color:var(--green);background:var(--green-subtle);transform:scale(1.12);box-shadow:0 0 0 4px rgba(22,163,74,.12)}
.csat-thanks{display:none;text-align:center;padding:14px;background:var(--green-subtle);border:1px solid var(--green-border);border-radius:var(--radius-md);color:var(--green);font-weight:600;font-size:14px}

/* ─── Spinner ─── */
.spinner-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 0}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin .75s linear infinite;margin-bottom:16px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinner-label{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}

/* ─── Error state ─── */
.error-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-xl);box-shadow:var(--shadow-md);padding:48px 32px;text-align:center;animation:fadeUp .4s ease}
.error-icon{font-size:48px;margin-bottom:16px}
.error-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:8px}
.error-desc{font-size:14px;color:var(--text-2);margin-bottom:24px;line-height:1.6}
.btn-ghost{display:inline-flex;align-items:center;gap:8px;padding:10px 20px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:transparent;font-family:var(--font);font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer;transition:all .15s}
.btn-ghost:hover{border-color:var(--border-strong);background:var(--bg);color:var(--text)}

/* ─── Page heading (ticket found) ─── */
.page-hero{padding:40px 0 32px;text-align:center}
.page-hero h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-1.5px;line-height:1.1;margin-bottom:8px}
.page-hero h1 span{color:var(--red)}
.page-hero h1 span.green{color:var(--green)}
.page-hero p{font-size:15px;color:var(--text-2)}

/* ─── Footer ─── */
.footer{text-align:center;padding:40px 0 20px;font-size:12px;color:var(--text-3);line-height:1.8}
.footer a{color:var(--red);text-decoration:none;font-weight:500}
.footer a:hover{text-decoration:underline}

/* ─── Responsive ─── */
@media(max-width:560px){
  .page{padding:88px 16px 60px}
  .ticket-header,.stages-section,.queue-section,.details-section,.csat-section{padding-left:20px;padding-right:20px}
  .details-grid{grid-template-columns:1fr}
  .ticket-num{font-size:36px}
  .input-row{flex-direction:column}
  .btn-primary{width:100%;justify-content:center}
  .csat-btn{width:48px;height:48px;font-size:20px}
}
</style>
</head>
<body>

<div class="accent-bar" id="accentBar"></div>

<nav class="nav">
  <div class="nav-inner">
    <a href="/" class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4"/><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/></svg>
      </div>
      <div>
        <div class="brand-name">Mesa de Ayuda</div>
        <div class="brand-sub">Lyncott Alimentaria</div>
      </div>
    </a>
    <div class="nav-status">
      <div class="live-dot"></div>
      <span>En vivo</span>
    </div>
  </div>
</nav>

<main class="page">
  <div id="appRoot">
    <div class="spinner-wrap">
      <div class="spinner"></div>
      <div class="spinner-label">Cargando…</div>
    </div>
  </div>
  <footer class="footer" id="footer" style="display:none">
    ¿Necesitas ayuda? <a href="mailto:soporte@lyncott.mx">soporte@lyncott.mx</a><br>
    <span id="footerNote"></span>
  </footer>
</main>

<script>
/* ── Config ── */
const JSON_URL   = 'https://api.jsonbin.io/v3/b/6ac803feac6210605a20c23c/latest';
const JSONBIN_KEY= '$2a$10$TpBa7K20E/97qB.HEwFmmukQFnNC6T4j6SBbqcksWDVraJNXwfa3y';

/* ── Utils ── */
const getParam = n => new URLSearchParams(window.location.search).get(n);

const esc = s => {
  if (s == null) return '—';
  const str = String(s);
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
};

const formatDate = s => {
  if (!s) return '—';
  const d = new Date(s);
  if (isNaN(d)) return '—';
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short',year:'numeric'}) + ' · ' +
         d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
};

const initials = n => {
  if (!n || typeof n !== 'string') return '?';
  return n.trim().split(/\s+/).map(x => x[0] || '').join('').toUpperCase().slice(0,2) || '?';
};

/* ── Field extractors (short Power Automate keys + raw SharePoint fallbacks) ── */
const getEstado    = t => t.estado?.Value || t.estado || t.EstadodelTicket0?.Value || t.EstadodelTicket0 || 'Abierto';
const getTecnico   = t => { const v = t.tecnico || t.Personalqueatiendeelticket || t.Personalqueatiendeestasolicitud_; if (!v) return '—'; if (typeof v === 'string') return v; return v.Value || v.DisplayName || v.Email || '—'; };
const getCategoria = t => t.categoria?.Value || t.categoria || t.SeleccionaelSoporteTecnicodesead?.Value || t.SeleccionaelSoporteTecnicodesead || '—';
const getPrioridad = t => t.prioridad?.Value || t.prioridad || t.Nivelesdeprioridad_x003a_?.Value || '—';
const getSolucion  = t => t.solucion || t.Soluci_x00f3_naticket_x003a_ || '';
const getNombre    = t => { const v = t.nombre; if (v && typeof v === 'object') return v.DisplayName || v.Email || '—'; return v || t.Escribetunombre_x003a_ || '—'; };
const getUbicacion = t => t.ubicacion?.Value || t.ubicacion || t.Selecionatuubicacion_x003a_?.Value || '—';
const getDesc      = t => t.descripcion || t.Descripci_x00f3_ndelaincidencia_ || '';

/* ── Stage logic ── */
const STAGES = ['Recibido', 'Asignado', 'En atención', 'Resuelto'];
const stageIndex = (estado, tecnico) => {
  const e = (estado || '').toLowerCase();
  if (e === 'atendido' || e === 'resuelto') return 3;
  if (e === 'en proceso' || e === 'en atención' || e === 'en atencion') return 2;
  if (tecnico && tecnico !== '—') return 1;
  return 0;
};

function buildStages(activeIdx) {
  return `<div class="stages">` + STAGES.map((label, i) => {
    let cls = i < activeIdx ? 'done' : i === activeIdx ? 'active' : 'pending';
    let innerCircle = '';
    if (cls === 'done') {
      innerCircle = `<svg viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3"/></svg>`;
    }
    return `<div class="stage ${cls}">
      <div class="stage-circle ${cls}">${innerCircle}</div>
      <div class="stage-label ${cls}">${esc(label)}</div>
    </div>` + (i < STAGES.length - 1 ? '' : '');
  }).join('') + `</div>`;
}

/* ── Avatar color palette ── */
const COLORS = ['#CC0000','#1D4ED8','#7C3AED','#C2410C','#0369A1','#15803D','#B45309','#BE185D'];
const avatarColor = name => COLORS[name.charCodeAt(0) % COLORS.length];

/* ── Render: Search screen ── */
function renderSearch() {
  document.getElementById('accentBar').className = 'accent-bar';
  document.getElementById('footer').style.display = 'none';
  document.getElementById('appRoot').innerHTML = `
    <div class="search-hero">
      <div class="search-hero-eyebrow">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        Portal de Seguimiento
      </div>
      <h1>Tu soporte,<br><span>en tiempo real</span></h1>
      <p>Ingresa tu número de ticket para ver el estado, el técnico asignado y tu posición en la fila.</p>
    </div>
    <div class="search-box">
      <div class="search-box-inner">
        <div class="field-label">Número de ticket</div>
        <div class="input-row">
          <input id="ticketInput" class="ticket-input" type="number" min="1" placeholder="793" autocomplete="off"
            onkeydown="if(event.key==='Enter')buscarTicket()">
          <button class="btn-primary" onclick="buscarTicket()">Consultar →</button>
        </div>
        <div class="input-hint" id="inputHint">Recibirás tu número en el correo de confirmación</div>
      </div>
      <div class="search-box-footer">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <span>Solo tú puedes ver tu ticket. No compartimos ni almacenamos datos personales.</span>
      </div>
    </div>`;
  setTimeout(() => { const inp = document.getElementById('ticketInput'); if (inp) inp.focus(); }, 50);
}

/* ── Render: Error ── */
function renderError(msg, showBack) {
  document.getElementById('accentBar').className = 'accent-bar';
  document.getElementById('footer').style.display = 'none';
  document.getElementById('appRoot').innerHTML = `
    <div class="page-hero" style="padding-bottom:16px">
      <h1>Ticket <span>no encontrado</span></h1>
    </div>
    <div class="error-card">
      <div class="error-icon">🔍</div>
      <div class="error-title">No encontramos tu ticket</div>
      <div class="error-desc">${esc(msg)}<br>Verifica el número en el correo que recibiste.</div>
      <button class="btn-ghost" onclick="window.location.href='/'">← Buscar otro ticket</button>
    </div>`;
}

/* ── Render: Active ticket ── */
function renderActivo(ticket, abiertos) {
  const id      = ticket.id || ticket.ID;
  const estado  = getEstado(ticket);
  const tecnico = getTecnico(ticket);
  const cat     = getCategoria(ticket);
  const prio    = getPrioridad(ticket);
  const nombre  = getNombre(ticket);
  const ubic    = getUbicacion(ticket);
  const desc    = getDesc(ticket);
  const fecha   = formatDate(ticket.fecha || ticket.Fechadecreacion || ticket.Created);
  const activeStage = stageIndex(estado, tecnico);

  /* Queue position */
  const idx   = abiertos.findIndex(t => String(t.id||t.ID) === String(id));
  const antes  = idx > 0 ? idx : 0;

  /* Badge */
  const isEnProceso = estado === 'En Proceso' || estado === 'En atención';
  const badge = isEnProceso
    ? `<div class="badge badge-inprogress"><div class="badge-dot"></div>En proceso</div>`
    : `<div class="badge badge-open"><div class="badge-dot"></div>Abierto</div>`;

  document.getElementById('accentBar').className = 'accent-bar';

  let heroTitle = estado === 'En Proceso'
    ? `Tu ticket está <span>en proceso</span>`
    : `Tu ticket está <span>en espera</span>`;

  let heroDesc = estado === 'En Proceso'
    ? 'Un técnico está trabajando en tu solicitud ahora mismo.'
    : 'Tu solicitud fue recibida. Te avisaremos por correo cuando sea atendida.';

  /* Technician block */
  let tecBlock = '';
  if (tecnico !== '—') {
    const color = avatarColor(tecnico);
    const ini   = initials(tecnico);
    tecBlock = `
      <div class="desc-label">Técnico asignado</div>
      <div class="tec-card">
        <div class="tec-avatar" style="background:${esc(color)}">${esc(ini)}</div>
        <div class="tec-info">
          <div class="tec-name">${esc(tecnico)}</div>
          <div class="tec-role">Soporte TI · Lyncott Alimentaria</div>
        </div>
        <div class="tec-active">Activo</div>
      </div>`;
  }

  /* Description block */
  let descBlock = '';
  if (desc) {
    descBlock = `
      <div class="desc-label" style="margin-top:4px">Tu solicitud</div>
      <div class="desc-box">${esc(desc)}</div>`;
  }

  /* Queue block */
  let queueBlock = '';
  if (abiertos.length > 0) {
    const queueMain = antes === 0
      ? `Eres el <strong>siguiente</strong> en ser atendido 🎉`
      : `Hay <strong>${antes} ticket${antes !== 1 ? 's' : ''}</strong> delante del tuyo`;
    const queueSub = antes === 0
      ? 'El técnico debería contactarte muy pronto.'
      : `Tu ticket #${id} está siendo procesado en orden de llegada.`;
    queueBlock = `
      <div class="queue-section">
        <div class="queue-banner">
          <div class="queue-icon">
            <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          </div>
          <div class="queue-text">
            <div class="queue-main">${queueMain}</div>
            <div class="queue-sub">${esc(queueSub)}</div>
          </div>
          <div class="queue-number">
            <div class="queue-number-val">${antes}</div>
            <div class="queue-number-label">antes</div>
          </div>
        </div>
      </div>`;
  }

  document.getElementById('appRoot').innerHTML = `
    <div class="page-hero">
      <h1>${heroTitle}</h1>
      <p>${esc(heroDesc)}</p>
    </div>

    <div class="card">
      <div class="ticket-header">
        <div class="ticket-num-block">
          <div class="ticket-num-label">Número de ticket</div>
          <div class="ticket-num">#${esc(String(id))}</div>
        </div>
        <div class="ticket-meta">
          ${badge}
          <div class="ticket-date-label">Creado el ${esc(fecha)}</div>
        </div>
      </div>

      <div class="stages-section">
        <div class="stages-title">Progreso del ticket</div>
        ${buildStages(activeStage)}
      </div>

      ${queueBlock}

      <div class="details-section">
        <div class="details-grid">
          <div class="detail-item">
            <div class="detail-label">Categoría</div>
            <div class="detail-val highlight">${esc(cat)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Prioridad</div>
            <div class="detail-val">${esc(prio)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Solicitante</div>
            <div class="detail-val">${esc(nombre)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Ubicación</div>
            <div class="detail-val">${esc(ubic)}</div>
          </div>
        </div>
        ${tecBlock}
        ${descBlock}
      </div>
    </div>

    <button class="btn-ghost" onclick="window.location.href='/'" style="margin:4px 0 8px">← Buscar otro ticket</button>`;

  document.getElementById('footerNote').textContent = `Ticket #${id} · Actualización automática cada 60 seg`;
  document.getElementById('footer').style.display = 'block';
}

/* ── Render: Resolved ticket ── */
function renderResuelto(ticket) {
  const id       = ticket.id || ticket.ID;
  const tecnico  = getTecnico(ticket);
  const solucion = getSolucion(ticket);
  const cat      = getCategoria(ticket);
  const nombre   = getNombre(ticket);
  const fechaCreado = formatDate(ticket.fecha || ticket.Fechadecreacion || ticket.Created);
  const fechaMod    = formatDate(ticket.Modified);

  document.getElementById('accentBar').className = 'accent-bar green';

  let tecBlock = '';
  if (tecnico !== '—') {
    const color = avatarColor(tecnico);
    const ini   = initials(tecnico);
    tecBlock = `
      <div class="desc-label">Atendido por</div>
      <div class="tec-card" style="border-color:var(--green-border);background:var(--green-subtle)">
        <div class="tec-avatar" style="background:${esc(color)}">${esc(ini)}</div>
        <div class="tec-info">
          <div class="tec-name">${esc(tecnico)}</div>
          <div class="tec-role">Soporte TI · Lyncott Alimentaria</div>
        </div>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2.5" style="margin-left:auto;flex-shrink:0"><polyline points="20 6 9 17 4 12"/></svg>
      </div>`;
  }

  let solucionBlock = '';
  if (solucion) {
    solucionBlock = `
      <div class="desc-label">Solución aplicada</div>

  }

  document.getElementById('appRoot').innerHTML = `
    <div class="page-hero">
      <h1>¡Tu ticket fue<br><span class="green">resuelto!</span></h1>
      <p>Tu solicitud fue atendida exitosamente. Gracias por tu paciencia.</p>
    </div>

    <div class="card">
      <div class="ticket-header">
        <div class="ticket-num-block">
          <div class="ticket-num-label">Número de ticket</div>
          <div class="ticket-num green">#${esc(String(id))}</div>
        </div>
        <div class="ticket-meta">
          <div class="badge badge-resolved"><div class="badge-dot"></div>Resuelto ✓</div>
          <div class="ticket-date-label">Resuelto el ${esc(fechaMod)}</div>
        </div>
      </div>

      <div class="stages-section">
        <div class="stages-title">Progreso del ticket</div>
        ${buildStages(3)}
      </div>

      <div class="details-section">
        <div class="details-grid">
          <div class="detail-item">
            <div class="detail-label">Categoría</div>
            <div class="detail-val highlight">${esc(cat)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Solicitante</div>
            <div class="detail-val">${esc(nombre)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Creado</div>
            <div class="detail-val">${esc(fechaCreado)}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Resuelto</div>
            <div class="detail-val" style="color:var(--green);font-weight:600">${esc(fechaMod)}</div>
          </div>
        </div>
        ${tecBlock}
        ${solucionBlock}
      </div>
    </div>

    <div class="card" style="border-color:var(--green-border)">
      <div class="csat-section">
        <div class="csat-title">¿Cómo fue tu experiencia?</div>
        <div class="csat-sub">Tu opinión nos ayuda a mejorar el servicio para todos.</div>
        <div class="csat-row">
          <button class="csat-btn" title="Muy malo"  onclick="calificar(this,1)">😞</button>
          <button class="csat-btn" title="Regular"   onclick="calificar(this,2)">😐</button>
          <button class="csat-btn" title="Bien"      onclick="calificar(this,3)">😊</button>
          <button class="csat-btn" title="Muy bien"  onclick="calificar(this,4)">😄</button>
          <button class="csat-btn" title="Excelente" onclick="calificar(this,5)">🤩</button>
        </div>
        <div class="csat-thanks" id="csatThanks">¡Gracias por tu calificación! 🙌</div>
      </div>
    </div>

    <button class="btn-ghost" onclick="window.location.href='/'" style="margin:4px 0 8px">← Buscar otro ticket</button>`;

  document.getElementById('footerNote').textContent = `Ticket #${id} · Cerrado exitosamente`;
  document.getElementById('footer').style.display = 'block';
}

/* ── CSAT handler ── */
function calificar(btn, score) {
  document.querySelectorAll('.csat-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
  const thanks = document.getElementById('csatThanks');
  if (thanks) thanks.style.display = 'block';
  /* Persist in localStorage per ticket so repeated views don't reset */
  const id = getParam('id');
  if (id) { try { localStorage.setItem('csat_'+id, score); } catch(e) {} }
}

/* ── Restore prior CSAT selection ── */
function restoreCsat(id) {
  try {
    const val = localStorage.getItem('csat_'+id);
    if (!val) return;
    const btns = document.querySelectorAll('.csat-btn');
    const idx  = parseInt(val) - 1;
    if (btns[idx]) { btns[idx].classList.add('selected'); }
    const thanks = document.getElementById('csatThanks');
    if (thanks) thanks.style.display = 'block';
  } catch(e) {}
}

/* ── Main data fetch ── */
async function init() {
  const idParam = getParam('id');
  if (!idParam) { renderSearch(); return; }

  const id = parseInt(idParam);
  if (!id || id <= 0) {
    renderSearch();
    setTimeout(() => {
      const h = document.getElementById('inputHint');
      if (h) { h.textContent = 'El número debe ser mayor a 0'; h.className = 'input-hint err'; }
    }, 50);
    return;
  }

  try {
    const res = await fetch(JSON_URL, {
      headers: { 'X-Master-Key': JSONBIN_KEY, 'X-Bin-Meta': 'false' }
    });
    if (!res.ok) throw new Error('Error de red ' + res.status);
    const data    = await res.json();
    const tickets = Array.isArray(data) ? data : (data.tickets || []);
    const ticket  = tickets.find(t => String(t.id || t.ID) === String(id));

    if (!ticket) {
      renderError('El ticket #' + id + ' no fue encontrado en los últimos registros.');
      return;
    }

    const estado = getEstado(ticket);
    if (estado === 'Atendido' || estado === 'Resuelto') {
      renderResuelto(ticket);
      setTimeout(() => restoreCsat(id), 200);
    } else {
      const abiertos = tickets
        .filter(t => { const e = getEstado(t); return e !== 'Atendido' && e !== 'Resuelto'; })
        .sort((a, b) => (a.id || a.ID) - (b.id || b.ID));
      renderActivo(ticket, abiertos);
    }
  } catch(e) {
    renderError('No se pudo conectar con el servidor. Intenta de nuevo en un momento.');
  }
}

/* ── Search input trigger ── */
function buscarTicket() {
  const inp = document.getElementById('ticketInput');
  if (!inp) return;
  const val = inp.value.trim();
  if (!val || parseInt(val) <= 0) {
    inp.className = 'ticket-input error';
    const hint = document.getElementById('inputHint');
    if (hint) { hint.textContent = 'Ingresa un número de ticket válido'; hint.className = 'input-hint err'; }
    inp.focus();
    return;
  }
  window.location.href = '/?id=' + parseInt(val);
}

/* ── Boot ── */
init();
setInterval(init, 60000);
</script>
